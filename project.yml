# XcodeGen の定義（design.md 15.1）。Tobe.xcodeproj は生成物なのでコミットしない。
# 変更後は `xcodegen generate` を実行する。
name: Tobe
options:
  bundleIdPrefix: io.github.hatohato25 # Q-27
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  # 署名 ID（CODE_SIGN_IDENTITY）と Local.xcconfig の取り込みはここ（D-26）
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  TobeCore:
    path: Packages/TobeCore
targets:
  Tobe:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "**/.gitkeep"
    dependencies:
      - package: TobeCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: $(TOBE_DISPLAY_NAME)
        CFBundleLocalizations: [en, ja] # 日本語以外は英語にする（Q-24）
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true # Dock と ⌘Tab に出さない（N-2.1）
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "Copyright © 2026 Tobe contributors. MIT License."
    settings:
      base:
        PRODUCT_NAME: Tobe
        PRODUCT_BUNDLE_IDENTIFIER: io.github.hatohato25.tobe
        # Info.plist は XcodeGen が info.properties から生成するため、INFOPLIST_KEY_* は効かない。
        # 表示名は独自の設定値を経由して Info.plist に渡す。
        TOBE_DISPLAY_NAME: Tobe
        MARKETING_VERSION: 0.2.1
        CURRENT_PROJECT_VERSION: 5
        ENABLE_HARDENED_RUNTIME: YES # 公証はしないが有効にしておく（D-26）
        ENABLE_APP_SANDBOX: NO # AX API とイベントタップのため（C-1）。entitlements ファイルは作らない（D-25）
        CODE_SIGN_STYLE: Manual # 署名 ID は Config/Base.xcconfig（D-26）
        DEVELOPMENT_TEAM: ""
        PROVISIONING_PROFILE_SPECIFIER: ""
        SWIFT_STRICT_CONCURRENCY: complete
        DEAD_CODE_STRIPPING: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES # String Catalog の訳の抜けを .stringsdata で確かめるため
      configs:
        Debug:
          # インストール済みのリリース版と、アクセシビリティの許可・UserDefaults を分ける（D-27）
          PRODUCT_BUNDLE_IDENTIFIER: io.github.hatohato25.tobe.debug
          TOBE_DISPLAY_NAME: Tobe Debug
schemes:
  Tobe:
    build:
      targets:
        Tobe: all
    run:
      config: Debug
    archive:
      config: Release
